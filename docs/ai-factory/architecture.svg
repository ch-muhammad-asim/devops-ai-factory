<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#f7fafc"/>

  <text x="800" y="62" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#102a43">AI Factory on Kubernetes (K3s)</text>
  <text x="800" y="98" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#486581">From infrastructure and data to useful AI outcomes</text>

  <rect x="55" y="180" width="285" height="190" rx="24" fill="#ffffff" stroke="#bcccdc" stroke-width="2"/>
  <text x="197" y="225" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#102a43">People + Data</text>
  <text x="197" y="270" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#486581">People and teams</text>
  <text x="197" y="302" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#486581">Documents, images and code</text>
  <text x="197" y="334" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#486581">Questions and feedback</text>

  <path d="M340 275 H405" stroke="#627d98" stroke-width="5" fill="none"/>
  <polygon points="405,275 386,264 386,286" fill="#627d98"/>

  <rect x="405" y="145" width="790" height="355" rx="30" fill="#6c5ce7"/>
  <text x="800" y="195" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#ffffff">AI Factory</text>
  <text x="800" y="226" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#ede9ff">A repeatable process that turns data into AI services</text>

  <rect x="445" y="270" width="155" height="110" rx="18" fill="#8175eb" stroke="#b9b2ff" stroke-width="2"/>
  <text x="522" y="315" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#ffffff">1. Prepare</text>
  <text x="522" y="345" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#f3f0ff">clean and organize</text>

  <path d="M600 325 H635" stroke="#ffffff" stroke-width="4" fill="none"/>
  <polygon points="635,325 620,316 620,334" fill="#ffffff"/>

  <rect x="635" y="270" width="155" height="110" rx="18" fill="#8175eb" stroke="#b9b2ff" stroke-width="2"/>
  <text x="712" y="315" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#ffffff">2. Build</text>
  <text x="712" y="345" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#f3f0ff">train and fine-tune</text>

  <path d="M790 325 H825" stroke="#ffffff" stroke-width="4" fill="none"/>
  <polygon points="825,325 810,316 810,334" fill="#ffffff"/>

  <rect x="825" y="270" width="155" height="110" rx="18" fill="#8175eb" stroke="#b9b2ff" stroke-width="2"/>
  <text x="902" y="315" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#ffffff">3. Serve</text>
  <text x="902" y="345" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#f3f0ff">apps, APIs and agents</text>

  <path d="M980 325 H1015" stroke="#ffffff" stroke-width="4" fill="none"/>
  <polygon points="1015,325 1000,316 1000,334" fill="#ffffff"/>

  <rect x="1015" y="270" width="140" height="110" rx="18" fill="#8175eb" stroke="#b9b2ff" stroke-width="2"/>
  <text x="1085" y="315" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#ffffff">4. Improve</text>
  <text x="1085" y="345" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#f3f0ff">monitor and learn</text>

  <rect x="565" y="410" width="470" height="66" rx="18" fill="#1976d2" stroke="#9cc9ff" stroke-width="2"/>
  <text x="800" y="440" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#ffffff">Kubernetes / K3s</text>
  <text x="800" y="464" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e5f1ff">Schedules, scales, restarts and isolates workloads</text>

  <path d="M1195 275 H1260" stroke="#627d98" stroke-width="5" fill="none"/>
  <polygon points="1260,275 1241,264 1241,286" fill="#627d98"/>

  <rect x="1260" y="180" width="285" height="190" rx="24" fill="#ffffff" stroke="#9ae6b4" stroke-width="2"/>
  <text x="1402" y="225" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#22543d">Useful AI</text>
  <text x="1402" y="270" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#486581">Chat assistants</text>
  <text x="1402" y="302" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#486581">Search and knowledge</text>
  <text x="1402" y="334" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#486581">Agents and automation</text>

  <path d="M800 500 V560" stroke="#627d98" stroke-width="5" fill="none"/>
  <polygon points="800,560 789,541 811,541" fill="#627d98"/>

  <rect x="340" y="585" width="280" height="135" rx="22" fill="#ffffff" stroke="#bcccdc" stroke-width="2"/>
  <text x="480" y="625" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#102a43">CPU Servers</text>
  <text x="480" y="660" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#486581">K3s control plane</text>
  <text x="480" y="688" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#486581">Ubuntu 26.04 LTS</text>

  <rect x="660" y="585" width="280" height="135" rx="22" fill="#d9f99d" stroke="#65a30d" stroke-width="2"/>
  <text x="800" y="625" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#365314">GPU Servers</text>
  <text x="800" y="660" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#3f6212">AI compute</text>
  <text x="800" y="688" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#3f6212">NVIDIA GPU Operator</text>

  <rect x="980" y="585" width="280" height="135" rx="22" fill="#ffffff" stroke="#bcccdc" stroke-width="2"/>
  <text x="1120" y="625" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#102a43">Storage + Network</text>
  <text x="1120" y="660" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#486581">Models and datasets</text>
  <text x="1120" y="688" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#486581">Fast and reliable data access</text>

  <path d="M480 585 V550 H800" stroke="#829ab1" stroke-width="3" fill="none"/>
  <path d="M800 585 V550" stroke="#829ab1" stroke-width="3" fill="none"/>
  <path d="M1120 585 V550 H800" stroke="#829ab1" stroke-width="3" fill="none"/>

  <rect x="255" y="775" width="1090" height="72" rx="20" fill="#243b53"/>
  <text x="800" y="805" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Terragrunt / Terraform - Infrastructure as Code</text>
  <text x="800" y="832" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#d9e2ec">Builds AWS networking, EC2, IAM, storage and load-balancing foundations</text>

  <path d="M480 775 V735" stroke="#627d98" stroke-width="3" fill="none"/>
  <path d="M800 775 V735" stroke="#627d98" stroke-width="3" fill="none"/>
  <path d="M1120 775 V735" stroke="#627d98" stroke-width="3" fill="none"/>

  <text x="60" y="875" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#627d98">Simple, scalable, open and repeatable</text>
  <text x="1540" y="875" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#627d98">AI Factory = infrastructure + Kubernetes + compute + data + AI services</text>
</svg>
